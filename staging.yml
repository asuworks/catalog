services:
  django:
    # Deployment/rollback unit: an immutable tag or digest injected by
    # deploy.sh as CATALOG_IMAGE. Mutable references (:latest, bare) are
    # rejected by the deploy flow; :latest is not a valid deployment unit.
    # See docs/deployment-runbook.md.
    image: ${CATALOG_IMAGE}
    environment:
      DOMAIN_NAME: 'staging-catalog.comses.net'
      # The release state records the single supported Elasticsearch service.
      ELASTICSEARCH_HOST: ${CATALOG_ES_HOST:?CATALOG_ES_HOST must be set}
    # Container labels record the deployment/rollback state:
    # which immutable image is deployed, which image was deployed before
    # this rollout (the rollback unit), and which ES endpoint the release
    # uses. Inspect with:
    #   docker inspect --format '{{json .Config.Labels}}' <django container>
    labels:
      - comses.catalog.image=${CATALOG_IMAGE}
      - comses.catalog.previous-image=${CATALOG_PREVIOUS_IMAGE:-none}
      - comses.catalog.previous-es-host=${CATALOG_PREVIOUS_ES_HOST:-none}
      - comses.catalog.es-host=${CATALOG_ES_HOST:?CATALOG_ES_HOST must be set}
    restart: always
    volumes:
      - static:/catalog/static
      # The Gunicorn unix socket is a filesystem object; nginx (a separate
      # container in the same stack) can only reach it through this shared
      # volume. See deploy/docker/prod.sh (bind) and the nginx upstream.
      - gunicornsocket:/catalog/socket
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --unix-socket /catalog/socket/gunicorn.sock http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  scheduler:
    image: ${CATALOG_IMAGE}
    command: ["/bin/sh", "/code/deploy/docker/scheduler.sh"]
    environment:
      DOMAIN_NAME: 'staging-catalog.comses.net'
      DJANGO_SETTINGS_MODULE: 'catalog.settings.prod'
      LANG: "C.UTF-8"
      DB_USER: catalog
      DB_HOST: db
      DB_NAME: comses_catalog
      DB_PORT: 5432
      ELASTICSEARCH_HOST: ${CATALOG_ES_HOST:?CATALOG_ES_HOST must be set}
    labels:
      - comses.catalog.image=${CATALOG_IMAGE}
      - comses.catalog.previous-image=${CATALOG_PREVIOUS_IMAGE:-none}
      - comses.catalog.previous-es-host=${CATALOG_PREVIOUS_ES_HOST:-none}
      - comses.catalog.es-host=${CATALOG_ES_HOST:?CATALOG_ES_HOST must be set}
    restart: always
    volumes:
      - ./docker/shared:/shared
    secrets:
      - catalog_django_config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
  nginx:
    image: nginx:1.28.3
    restart: always
    volumes:
      - ./deploy/nginx/catalog-haproxy.conf:/etc/nginx/nginx.conf
      - gunicornsocket:/catalog/socket
      - static:/catalog/static
      - ./docker/shared/nginx/logs:/var/log/nginx
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${CATALOG_HTTP_BIND:-127.0.0.1:80}:80"
    depends_on:
      django:
        condition: service_healthy

volumes:
  # Renamed from uwsgisocket when the app server moved from uWSGI to
  # Gunicorn: after the first deploy of this change the old volume
  # (catalog_uwsgisocket) is orphaned and can be removed with
  # `docker volume rm catalog_uwsgisocket`. It holds only the socket
  # file, so no data is lost.
  gunicornsocket:
    driver: local
