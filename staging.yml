services:
  django:
    image: ${CATALOG_IMAGE:?CATALOG_IMAGE must be an immutable digest}
    environment:
      DOMAIN_NAME: ${CATALOG_DOMAIN:?CATALOG_DOMAIN must be set}
      DJANGO_SETTINGS_MODULE: 'catalog.settings.staging'
    labels:
      - comses.catalog.image=${CATALOG_IMAGE}
      - comses.catalog.bundle-revision=${CATALOG_BUNDLE_REVISION:?CATALOG_BUNDLE_REVISION must be set}
      - comses.catalog.host-id=${CATALOG_ENV:?CATALOG_ENV must be set}
    restart: always
    volumes:
      - static:/catalog/static
      # The Gunicorn unix socket is a filesystem object; nginx (a separate
      # container in the same stack) can only reach it through this shared
      # volume. See deploy/docker/prod.sh (bind) and the nginx upstream.
      - gunicornsocket:/catalog/socket
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --unix-socket /catalog/socket/gunicorn.sock http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  scheduler:
    image: ${CATALOG_IMAGE:?CATALOG_IMAGE must be an immutable digest}
    command: ["/bin/sh", "/code/deploy/docker/scheduler.sh"]
    environment:
      DOMAIN_NAME: ${CATALOG_DOMAIN:?CATALOG_DOMAIN must be set}
      DJANGO_SETTINGS_MODULE: 'catalog.settings.staging'
      LANG: "C.UTF-8"
      DB_USER: catalog
      DB_HOST: db
      DB_NAME: comses_catalog
      DB_PORT: 5432
      ELASTICSEARCH_HOST: elasticsearch
    labels:
      - comses.catalog.image=${CATALOG_IMAGE}
      - comses.catalog.bundle-revision=${CATALOG_BUNDLE_REVISION:?CATALOG_BUNDLE_REVISION must be set}
      - comses.catalog.host-id=${CATALOG_ENV:?CATALOG_ENV must be set}
    restart: always
    volumes:
      - ${CATALOG_SHARED_DIR:?CATALOG_SHARED_DIR must be set}:/shared
    secrets:
      - catalog_django_config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/catalog-scheduler.env && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  nginx:
    image: nginx:1.28.3@sha256:146adea4768b83c607d0bdfa4188464e3da6e0a3ad4475db1d1d8f64f27c29cc
    restart: always
    volumes:
      - ${CATALOG_BUNDLE_DIR:?CATALOG_BUNDLE_DIR must be set}/deploy/nginx/catalog-haproxy.conf:/etc/nginx/nginx.conf:ro
      - gunicornsocket:/catalog/socket
      - static:/catalog/static
      - ${CATALOG_SHARED_DIR:?CATALOG_SHARED_DIR must be set}/nginx/logs:/var/log/nginx
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${CATALOG_HTTP_BIND:-127.0.0.1:80}:80"
    depends_on:
      django:
        condition: service_healthy

volumes:
  # Renamed from uwsgisocket when the app server moved from uWSGI to
  # Gunicorn: after the first deploy of this change the old volume
  # (catalog_uwsgisocket) is orphaned and can be removed with
  # `docker volume rm catalog_uwsgisocket`. It holds only the socket
  # file, so no data is lost.
  gunicornsocket:
    driver: local
