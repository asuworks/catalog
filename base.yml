# Shared services for all Compose environments (dev, staging, prod).
# The stack is a single monolithic Compose project (project name pinned
# below so volumes and the network keep their `catalog_*` identities).
name: catalog
services:
  redis:
    image: redis:8.10.1
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    environment:
      - cluster.name=catalog-search
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - ./deploy/elasticsearch.conf.d/elasticsearch8.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      # Never attach Elasticsearch 8 to the legacy ES6 data volume. Search data
      # is rebuilt from PostgreSQL into this separate volume.
      - esdata8:/usr/share/elasticsearch/data
  db:
    image: postgres:18
    volumes:
      - ./docker/pgdata:/var/lib/postgresql
    restart: always
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD_FILE: /run/secrets/catalog_db_password
      POSTGRES_DB: comses_catalog
    secrets:
      - catalog_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d comses_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  django:
    volumes:
      - ./docker/shared:/shared
    environment:
      DJANGO_SETTINGS_MODULE: 'catalog.settings.prod'
      LANG: "C.UTF-8"
      DB_USER: catalog
      DB_HOST: db
      DB_NAME: comses_catalog
      DB_PORT: 5432
      ELASTICSEARCH_HOST: elasticsearch
    secrets:
      - catalog_django_config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
volumes:
  esdata8:
    driver: local
  static:
    driver: local

# File-based Compose secrets (replace the former external swarm secrets).
# The runtime path /run/secrets/<name> matches the secret name: the app
# reads /run/secrets/catalog_django_config (catalog/settings/base.py) and
# the Postgres entrypoint reads POSTGRES_PASSWORD_FILE
# (/run/secrets/catalog_db_password). The source files are generated by
# `make config-generate`.
secrets:
  catalog_django_config:
    file: ./deploy/conf/config.ini
  catalog_db_password:
    file: ./deploy/conf/postgres_password
